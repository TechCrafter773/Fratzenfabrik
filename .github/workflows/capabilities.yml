name: App-Funktionen einschalten

# Schaltet in App Store Connect die Funktionen ein, die das Krokodilspiel braucht (SharePlay / Group Activities).
on:
  workflow_dispatch:

jobs:
  capabilities:
    runs-on: ubuntu-latest
    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
      BUNDLE_ID: com.techcrafter773.fratzenfabrik
    steps:
      - run: pip install --quiet "pyjwt[crypto]" requests

      - name: SharePlay für die App-ID einschalten
        shell: python
        run: |
          import base64, json, os, sys, time
          import jwt, requests

          raw = os.environ["ASC_KEY_P8"]
          key = raw if "BEGIN PRIVATE KEY" in raw else base64.b64decode(raw).decode()
          token = jwt.encode(
              {"iss": os.environ["ASC_ISSUER_ID"], "iat": int(time.time()), "exp": int(time.time()) + 900,
               "aud": "appstoreconnect-v1"},
              key, algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"})
          api = "https://api.appstoreconnect.apple.com/v1"
          h = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}

          ids = requests.get(f"{api}/bundleIds", headers=h,
                             params={"filter[identifier]": os.environ["BUNDLE_ID"]}).json()
          match = [b for b in ids.get("data", []) if b["attributes"]["identifier"] == os.environ["BUNDLE_ID"]]
          if not match:
              sys.exit(f"Bundle-ID nicht gefunden: {json.dumps(ids)[:500]}")
          bundle_id = match[0]["id"]

          caps = requests.get(f"{api}/bundleIds/{bundle_id}/bundleIdCapabilities", headers=h).json()
          have = [c["attributes"]["capabilityType"] for c in caps.get("data", [])]
          print("Bisher eingeschaltet:", have)

          for wanted in ["GROUP_ACTIVITIES"]:
              if wanted in have:
                  print(wanted, "ist schon an ✅")
                  continue
              body = {"data": {"type": "bundleIdCapabilities",
                               "attributes": {"capabilityType": wanted},
                               "relationships": {"bundleId": {"data": {"type": "bundleIds", "id": bundle_id}}}}}
              r = requests.post(f"{api}/bundleIdCapabilities", headers=h, json=body)
              print(wanted, r.status_code, r.text[:1500])
              if not r.ok:
                  sys.exit(f"{wanted} konnte nicht eingeschaltet werden")
              print(wanted, "eingeschaltet ✅")
