name: Game Center einschalten

# Schaltet Game Center für die App in App Store Connect ein (nötig fürs Krokodilspiel übers Internet).
on:
  workflow_dispatch:

jobs:
  gamecenter:
    runs-on: ubuntu-latest
    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
      BUNDLE_ID: com.techcrafter773.fratzenfabrik
    steps:
      - run: pip install --quiet "pyjwt[crypto]" requests

      - name: Game Center aktivieren
        shell: python
        run: |
          import base64, json, os, sys, time
          import jwt, requests

          raw = os.environ["ASC_KEY_P8"]
          key = raw if "BEGIN PRIVATE KEY" in raw else base64.b64decode(raw).decode()
          token = jwt.encode(
              {"iss": os.environ["ASC_ISSUER_ID"], "iat": int(time.time()), "exp": int(time.time()) + 900,
               "aud": "appstoreconnect-v1"},
              key, algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"})
          api = "https://api.appstoreconnect.apple.com/v1"
          h = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}

          apps = requests.get(f"{api}/apps", headers=h, params={"filter[bundleId]": os.environ["BUNDLE_ID"]}).json()
          if not apps.get("data"):
              sys.exit(f"App nicht gefunden: {json.dumps(apps)[:500]}")
          app_id = apps["data"][0]["id"]
          print("App:", app_id)

          current = requests.get(f"{api}/apps/{app_id}/gameCenterDetail", headers=h)
          print("Bisher:", current.status_code, current.text[:300])
          if current.ok and current.json().get("data"):
              print("Game Center ist schon eingeschaltet ✅")
              sys.exit(0)

          body = {"data": {"type": "gameCenterDetails",
                           "relationships": {"app": {"data": {"type": "apps", "id": app_id}}}}}
          created = requests.post(f"{api}/gameCenterDetails", headers=h, json=body)
          print("Einschalten:", created.status_code, created.text[:800])
          if not created.ok:
              sys.exit("Game Center konnte nicht eingeschaltet werden – bitte in App Store Connect von Hand aktivieren.")
          print("Game Center eingeschaltet ✅")
